<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n-doc-title="trashDocTitle">ゴミ箱</title>
<link rel="stylesheet" href="colors.css" />
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #0066CC;
    --border: #E0E0E0;
    --text: #1A1A1A;
    --text-muted: #666;
    --bg: #F5F5F7;
    --card: #FFFFFF;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --border: #333;
      --text: #E8E8E8;
      --text-muted: #999;
      --bg: #1C1C1E;
      --card: #2C2C2E;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    user-select: none;
    -webkit-user-select: none;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
  }

  .header h1 {
    font-size: 16px;
    font-weight: 600;
  }

  .trash-count {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
  }

  .btn-empty {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-empty:hover {
    background: #FF3B30;
    color: white;
    border-color: #FF3B30;
  }

  .list {
    padding: 8px 12px;
    overflow-y: auto;
    height: calc(100vh - 56px);
  }

  .empty-msg {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 0;
    font-size: 14px;
  }

  .item {
    display: flex;
    align-items: stretch;
    gap: 10px;
    padding: 10px;
    border-radius: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    margin-bottom: 8px;
    transition: box-shadow 0.15s;
  }
  .item:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .item-color {
    width: 6px;
    min-height: 100%;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .item-body {
    flex: 1;
    min-width: 0;
  }

  .item-preview {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 60px;
    overflow: hidden;
  }

  .item-date {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .item-actions {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .btn-restore {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }
  .btn-restore:hover {
    opacity: 0.85;
  }

  /* ── Focus Indicator ──────────────────────────────── */
  .btn-empty:focus-visible,
  .btn-restore:focus-visible {
    outline: 2px solid rgba(0, 102, 204, 0.6);
    outline-offset: 2px;
  }

</style>
</head>
<body>
  <div class="header">
    <h1><span data-i18n="trashHeading">ゴミ箱</span> <span id="trash-count" class="trash-count"></span></h1>
    <button class="btn-empty" id="btn-empty" aria-label="すべて削除" data-i18n="emptyTrashButton" data-i18n-aria-label="emptyTrashButton">すべて削除</button>
  </div>
  <div class="list" id="list" role="list" aria-label="削除した付箋" data-i18n-aria-label="trashListAriaLabel"></div>

<script src="utils.js"></script>
<script src="i18n.js"></script>
<script src="trash.js"></script>
</body>
</html>
