<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Note</title>
<link rel="stylesheet" href="colors.css" />
<style>
  /* ── Reset & Base ─────────────────────────────────── */
  *, *::before, *::after {
    margin: 0; padding: 0; box-sizing: border-box;
  }

  :root {
    --bg: var(--yellow);
    --bar: var(--yellow-bar);
    --text: #3E3A2E;
    --text-muted: rgba(62, 58, 46, 0.4);
    --radius: 8px;
    --shadow: 0 8px 32px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── Note Container ───────────────────────────────── */
  .note {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: background 0.3s ease;
  }

  /* ── Title Bar (draggable) ────────────────────────── */
  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 32px;
    min-height: 32px;
    padding: 0 8px;
    background: var(--bar);
    cursor: grab;
    transition: background 0.3s ease;
  }

  .titlebar:active { cursor: grabbing; }

  .titlebar-left, .titlebar-right {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* ── Toolbar Buttons ──────────────────────────────── */
  .btn {
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.08);
    color: var(--text);
    font-size: 11px;
    line-height: 1;
    transition: background 0.15s, transform 0.1s;
    -webkit-app-region: no-drag;
  }

  .btn:hover {
    background: rgba(0,0,0,0.16);
    transform: scale(1.1);
  }

  .btn:active { transform: scale(0.95); }

  .btn-close {
    background: rgba(0,0,0,0.06);
  }
  .btn-close:hover {
    background: #FF5F57;
    color: white;
  }

  .btn-pin.active {
    background: rgba(0,0,0,0.22);
    transform: rotate(-45deg);
  }
  .btn-pin.active:hover {
    background: rgba(0,0,0,0.28);
  }

  .btn svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
  }

  /* ── Color Picker ─────────────────────────────────── */
  .color-picker {
    display: none;
    position: absolute;
    top: 36px;
    right: 8px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 12px;
    padding: 8px;
    gap: 6px;
    flex-wrap: wrap;
    width: 90px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 100;
    -webkit-app-region: no-drag;
  }

  .color-picker.open { display: flex; }

  .color-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }

  .color-dot:hover { transform: scale(1.15); }
  .color-dot.active { border-color: rgba(0,0,0,0.4); }

  .color-dot[data-color="yellow"]  { background: var(--yellow-bar); }
  .color-dot[data-color="blue"]    { background: var(--blue-bar); }
  .color-dot[data-color="green"]   { background: var(--green-bar); }
  .color-dot[data-color="pink"]    { background: var(--pink-bar); }
  .color-dot[data-color="purple"]  { background: var(--purple-bar); }
  .color-dot[data-color="gray"]    { background: var(--gray-bar); }

  /* ── Text Area ────────────────────────────────────── */
  .content {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  /* ── Markdown Surface ─────────────────────────────── */
  .markdown-view {
    position: absolute;
    inset: 0;
    padding: 12px 16px;
    overflow-y: auto;
    cursor: text;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    user-select: text;
    -webkit-user-select: text;
  }

  /* 生エディタ（`.raw-editor`）— 描画済みの行と差し替えて生 Markdown を出す */
  .raw-editor {
    outline: none;
    background: rgba(0,0,0,0.04);
    border-radius: 3px;
    padding: 0 2px;
    margin: 0 -2px;
    min-height: 21px;
    font: inherit;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .raw-editor.atomic {
    white-space: pre;
    overflow-x: auto;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 0.9em;
    line-height: 1.4;
  }

  /* プレビューが続くときだけ、ed の下側の角丸を落として 1 枚のカードに繋げる
     （margin は元々 0 -2px で下側の隙間が無いので、角丸だけ合わせれば繋がって見える） */
  .raw-editor.has-preview {
    border-radius: 3px 3px 0 0;
  }
  /* atomic（横スクロール）のスクロールバーが太い帯に見えてカードの一体感を壊すため、
     プレビューと繋がるとき（has-preview）だけ隠す。スクロール自体・キャレット追従の
     自動スクロールは残る（overflow-x: auto のまま）。フェンスの atomic（has-preview
     が付かない）には影響しない */
  .raw-editor.has-preview.atomic {
    scrollbar-width: none;
  }
  .raw-editor.has-preview.atomic::-webkit-scrollbar {
    display: none;
  }

  /* 画像を含む行を生表示にしたときだけ、ed の直下に出す編集不可のプレビュー。
     生エディタへの差し替えで画像の高さぶん表示がずれるのを抑える（操作対象にはしない）。
     背景・左右 padding/margin・角丸を ed と揃え、「この記法とこの画像は同じもの」と
     分かる 1 枚のカードに見せる */
  .raw-editor-preview {
    background: rgba(0,0,0,0.04);
    border-radius: 0 0 3px 3px;
    padding: 0 2px;
    margin: 0 -2px;
    /* 自身はクリックを受け取り mdView の「余白クリック→最終行へ」分岐に落とさせない
       （note.js の mouseup ハンドラで .raw-editor-preview 自体は無視する）。
       子孫（img 等）は操作対象にしないため pointer-events: none を継承させる */
    pointer-events: auto;
    user-select: none;
  }
  .raw-editor-preview * {
    pointer-events: none;
  }
  /* 淡さは画像そのものだけに掛ける。ラッパーに掛けると背景（カードの地の色）まで
     淡くなってしまい、ed と繋がった 1 枚のカードに見えなくなる */
  .raw-editor-preview img {
    opacity: 0.55;
  }

  .md-placeholder { color: var(--text-muted); }
  .md-line, .md-empty { min-height: 21px; word-break: break-word; }
  #markdown-view img { max-width: 100%; }
  /* クリックでは編集に入らない（ダブルクリックで開く）ため、操作できることをホバーで示す */
  #markdown-view img:hover {
    outline: 2px solid var(--bar);
    outline-offset: -2px;
    cursor: pointer;
    filter: brightness(0.94);
  }
  /* クリック選択（画像を選んで Backspace/Delete で削除できる状態）。ホバー枠より太く、
     ノートの配色（--bar）に依存しない固定色にして、どの付箋の色でも視認できるようにする */
  #markdown-view img.img-selected {
    outline: 3px solid #0a84ff;
    outline-offset: 1px;
    box-shadow: 0 0 0 1px rgba(10, 132, 255, 0.35);
  }
  /* 選択状態は DOM 選択（Range）を画像に張って作る（⌘C/⌘X をネイティブ Edit メニュー経由で
     機能させるための仕掛け）。ブラウザ既定の選択ハイライト（青みがかった網掛け）が
     .img-selected の枠と二重に見えないよう透明化する */
  #markdown-view img.img-selected::selection {
    background: transparent;
  }
  /* 画像ホバー時に右下へ出すリサイズハンドル。共有 1 要素を画像ごとに位置だけ動かして使い回す。
     mdView.innerHTML の再描画（renderAll）で消されないよう、mdView の外（body 直下）に置く。
     position: fixed でビューポート座標に直接置くので、mdView のスクロール位置の影響を受けない */
  .img-resize-handle {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    background: var(--bar);
    border: 1px solid rgba(0,0,0,0.3);
    cursor: nwse-resize;
    z-index: 1;
    display: none;
  }
  .img-resize-handle.visible { display: block; }
  .md-h1 { font-size: 17px; font-weight: 700; line-height: 1.4; margin: 4px 0 2px; }
  .md-h2 { font-size: 15px; font-weight: 600; line-height: 1.4; margin: 3px 0 1px; }
  .md-h3 { font-size: 14px; font-weight: 600; line-height: 1.4; margin: 2px 0 1px; }

  .md-indent-1 { margin-left: 20px; }
  .md-indent-2 { margin-left: 40px; }
  .md-indent-3 { margin-left: 60px; }
  .md-indent-4 { margin-left: 80px; }
  .md-indent-5 { margin-left: 100px; }

  .md-bullet { position: relative; min-height: 21px; padding-left: 18px; }
  .md-bullet::before { content: '•'; position: absolute; left: 3px; }

  .md-check {
    position: relative;
    min-height: 21px;
    padding-left: 18px;
    word-break: break-word;
  }
  .md-check::before {
    content: '☐';
    position: absolute;
    left: 0;
    font-size: 1em;
  }
  .md-check.checked::before {
    content: '☑';
  }
  .md-check input[type="checkbox"] {
    position: absolute;
    left: 0;
    top: 0;
    width: 16px;
    height: 16px;
    opacity: 0;
    cursor: pointer;
    z-index: 1;
  }
  .md-check.checked span { text-decoration: line-through; opacity: 0.45; }

  .md-blockquote {
    border-left: 3px solid var(--text-muted);
    padding-left: 10px;
    color: var(--text-muted);
    min-height: 21px;
    word-break: break-word;
  }

  .md-hr {
    border: none;
    border-top: 1px solid var(--text-muted);
    margin: 6px 0;
  }

  .md-ordered {
    position: relative;
    min-height: 21px;
    padding-left: 18px;
    word-break: break-word;
  }
  .md-order-num {
    position: absolute;
    left: 0;
  }

  .markdown-view code {
    background: rgba(0,0,0,0.06);
    border-radius: 3px;
    padding: 1px 4px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 0.9em;
  }

  .md-codeblock {
    background: rgba(0,0,0,0.06);
    border-radius: 6px;
    padding: 8px 12px;
    margin: 4px 0;
    overflow-x: auto;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 0.9em;
    line-height: 1.4;
    white-space: pre;
  }
  .md-codeblock code {
    background: none;
    border-radius: 0;
    padding: 0;
    font-size: inherit;
  }

  .markdown-view a {
    color: #1565C0;
    text-decoration: underline;
    text-decoration-color: rgba(21, 101, 192, 0.4);
    cursor: pointer;
  }
  .markdown-view a:hover {
    text-decoration-color: rgba(21, 101, 192, 0.8);
  }

  /* ── Resize Handle ────────────────────────────────── */
  .resize-handle {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 16px;
    height: 16px;
    cursor: nwse-resize;
    opacity: 0.3;
    transition: opacity 0.2s;
  }

  .resize-handle:hover { opacity: 0.6; }

  .resize-handle::before,
  .resize-handle::after {
    content: '';
    position: absolute;
    background: var(--text);
    border-radius: 1px;
  }
  /* ── Focus Indicator ──────────────────────────────── */
  .btn:focus-visible,
  .color-dot:focus-visible {
    outline: 2px solid rgba(0, 102, 204, 0.6);
    outline-offset: 2px;
  }

  .resize-handle::before {
    width: 8px; height: 1.5px;
    bottom: 4px; right: 2px;
    transform: rotate(-45deg);
  }
  .resize-handle::after {
    width: 5px; height: 1.5px;
    bottom: 3px; right: 1px;
    transform: rotate(-45deg);
  }
</style>
</head>
<body>
  <div class="note" id="note">
    <!-- Titlebar -->
    <div class="titlebar" id="titlebar">
      <div class="titlebar-left">
        <button class="btn btn-close" id="btn-delete" title="削除" data-i18n-title="delete">
          <svg viewBox="0 0 12 12"><line x1="3" y1="3" x2="9" y2="9"/><line x1="9" y1="3" x2="3" y2="9"/></svg>
        </button>
      </div>
      <div class="titlebar-right">
        <button class="btn" id="btn-new" title="新しい付箋" data-i18n-title="newNote">
          <svg viewBox="0 0 12 12"><line x1="6" y1="2" x2="6" y2="10"/><line x1="2" y1="6" x2="10" y2="6"/></svg>
        </button>
        <button class="btn btn-pin" id="btn-pin" title="ピン留め" aria-label="ピン留め" aria-pressed="false">
          <svg viewBox="0 0 12 12"><path d="M6 11V7M3.5 7h5l-.7-2.5H4.2L3.5 7ZM4.5 4.5V2.2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 .5.5V4.5" fill="none"/></svg>
        </button>
        <button class="btn" id="btn-color" title="色" data-i18n-title="color">
          <svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </div>

    <!-- Color Picker -->
    <div class="color-picker" id="color-picker" role="radiogroup" aria-label="付箋の色" data-i18n-aria-label="noteColorAriaLabel">
      <div class="color-dot" data-color="yellow" role="radio" aria-label="イエロー" aria-checked="false" tabindex="0" data-i18n-aria-label="colorYellow"></div>
      <div class="color-dot" data-color="blue" role="radio" aria-label="ブルー" aria-checked="false" tabindex="-1" data-i18n-aria-label="colorBlue"></div>
      <div class="color-dot" data-color="green" role="radio" aria-label="グリーン" aria-checked="false" tabindex="-1" data-i18n-aria-label="colorGreen"></div>
      <div class="color-dot" data-color="pink" role="radio" aria-label="ピンク" aria-checked="false" tabindex="-1" data-i18n-aria-label="colorPink"></div>
      <div class="color-dot" data-color="purple" role="radio" aria-label="パープル" aria-checked="false" tabindex="-1" data-i18n-aria-label="colorPurple"></div>
      <div class="color-dot" data-color="gray" role="radio" aria-label="グレー" aria-checked="false" tabindex="-1" data-i18n-aria-label="colorGray"></div>
    </div>

    <!-- Content -->
    <div class="content">
      <div class="markdown-view" id="markdown-view" role="document" aria-label="付箋の内容" data-i18n-aria-label="noteContentAriaLabel"></div>
    </div>
  </div>


<script src="utils.js"></script>
<script src="i18n.js"></script>
<script src="markdown.js"></script>
<script src="note-lines.js"></script>
<script src="note.js"></script>
</body>
</html>
