version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      npm:
        patterns: ["*"]
        # Playwright は VRT のベースライン再生成が要るので単独 PR にする
        exclude-patterns: ["@playwright/test"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Cargo.toml は src-tauri/ にある
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
