version: 2

# 更新は半年に 1 度 dependabot が自動で拾う（interval 参照）。
# 溜まった PR は scripts/check-dependabot.sh がリリース前に片付けさせる。
# 脆弱性は interval と無関係に Dependabot alerts と security updates が拾う（リポジトリの Settings 側で有効化済み）。
# 自動マージは入れない。CI は実アプリを起動しない（Playwright は __TAURI__ をモックし、
# Rust 側は純粋関数の unit test だけ）ので、緑でも挙動の変化は人が見るしかない。
#
# major を minor / patch と同じグループに入れないこと。major だけが壊れたときに
# 無害な更新まで道連れになり、リリース直前に切り分け作業が発生する。

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: semiannually
    commit-message:
      prefix: "⬆️"
    groups:
      # Playwright は VRT のベースライン再生成が要るので単独 PR にする
      npm-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["@playwright/test"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        exclude-patterns: ["@playwright/test"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: semiannually
    commit-message:
      prefix: "⬆️"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]

  # Cargo.toml は src-tauri/ にある
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: semiannually
    commit-message:
      prefix: "⬆️"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      cargo-major:
        patterns: ["*"]
        update-types: [major]
